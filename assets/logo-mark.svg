<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <radialGradient id="bgG" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0B192C"/>
    </radialGradient>
    <radialGradient id="globeG" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.95"/>
      <stop offset="45%" stop-color="#0284C7" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#0B192C" stop-opacity="0.98"/>
    </radialGradient>
    <linearGradient id="monoG" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="30%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#1D4ED8"/>
    </linearGradient>
    <linearGradient id="goldG" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FDE68A"/>
      <stop offset="50%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="b"/>
      <feComposite in="SourceGraphic" in2="b" operator="over"/>
    </filter>
  </defs>

  <!-- Squircle Base Tile -->
  <rect width="200" height="200" rx="46" fill="url(#bgG)"/>
  <rect width="196" height="196" x="2" y="2" rx="44" fill="none" stroke="rgba(255,255,255,0.16)" stroke-width="2"/>

  <!-- Celestial 3D Globe Sphere -->
  <circle cx="100" cy="100" r="73" fill="url(#globeG)"/>
  
  <!-- Latitude & Longitude Coordinates -->
  <ellipse cx="100" cy="100" rx="25" ry="73" fill="none" stroke="#BAE6FD" stroke-width="1.5" opacity="0.6"/>
  <ellipse cx="100" cy="100" rx="50" ry="73" fill="none" stroke="#BAE6FD" stroke-width="1.5" opacity="0.4"/>
  <line x1="27" y1="100" x2="173" y2="100" stroke="#BAE6FD" stroke-width="1.5" opacity="0.6"/>
  <path d="M 39 68 Q 100 85 161 68" fill="none" stroke="#BAE6FD" stroke-width="1.3" opacity="0.45"/>
  <path d="M 39 132 Q 100 115 161 132" fill="none" stroke="#BAE6FD" stroke-width="1.3" opacity="0.45"/>

  <!-- Back Golden Shipping Orbit Arc -->
  <path d="M 31 104 C 31 62, 169 62, 169 104" fill="none" stroke="url(#goldG)" stroke-width="2.5" stroke-dasharray="5 3.5" opacity="0.5"/>

  <!-- The Ambright Corporate A/M Monogram with High-Contrast White Rim -->
  <g transform="translate(100, 100) scale(1.08) translate(-74.5, -74.5)">
    <!-- Drop Shadow / Separation Rim -->
    <path d="M 65 6 L 84 6 L 116 88 L 138 88 L 145 108 L 126 108 L 138 143 L 107 143 L 92 108 L 74.5 128 L 57 108 L 42 143 L 11 143 L 23 108 L 4 108 L 11 88 L 33 88 Z M 74.5 64 L 90 103 L 74.5 110 L 59 103 Z"
          fill="#0B192C" stroke="#FFFFFF" stroke-width="6.5" stroke-linejoin="round"/>
    <!-- Monogram Solid Body -->
    <path d="M 65 6 L 84 6 L 116 88 L 138 88 L 145 108 L 126 108 L 138 143 L 107 143 L 92 108 L 74.5 128 L 57 108 L 42 143 L 11 143 L 23 108 L 4 108 L 11 88 L 33 88 Z M 74.5 64 L 90 103 L 74.5 110 L 59 103 Z"
          fill="url(#monoG)" fill-rule="evenodd" stroke="#60A5FA" stroke-width="1.8" stroke-linejoin="round"/>
    <!-- Inner M Chevron Accent in Warm Gold -->
    <path d="M 57 108 L 74.5 128 L 92 108" fill="none" stroke="#F59E0B" stroke-width="4.8" stroke-linecap="round"/>
  </g>

  <!-- Front Golden Shipping Orbit Arc -->
  <path d="M 25 112 C 25 158, 175 158, 175 112" fill="none" stroke="url(#goldG)" stroke-width="3.8" stroke-linecap="round" filter="url(#goldGlow)"/>
  <!-- Maritime Port Beacon Satellite -->
  <circle cx="158" cy="125" r="7.5" fill="#FCD34D" filter="url(#goldGlow)"/>
  <circle cx="158" cy="125" r="3.5" fill="#FFFFFF"/>
  <circle cx="42" cy="125" r="5" fill="#F59E0B"/>
  <circle cx="42" cy="125" r="2" fill="#FFFFFF"/>
</svg>